# Netlify settings for the REAL game: build Game/ and publish Game/dist. Nothing to fill in on the Netlify site.
[build]
  base = "Game"
  command = "npm ci && npm run build && rm -f dist/artifact.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# the service worker and the page must always be fresh; everything else can be cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
